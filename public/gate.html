<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>riian gèng</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/faces.css" />
    <style>
      @font-face {
        font-family: "Fahkwang";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/fahkwang/Fahkwang-Regular.woff2") format("woff2"),
             url("/fonts/fahkwang/Fahkwang-Regular.ttf") format("truetype");
        unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
      }
      :root {
        --paper: #f2ead8;
        --lacquer: #9a2b1f;
        --ink: #1c1710;
        --ink-2: #5a5146;
        --display: "Fraunces", "Iowan Old Style", Georgia, serif;
        --thai: "Noto Serif Thai", "Charis SIL", serif;
      }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: var(--display);
        font-optical-sizing: none;
        letter-spacing: 0.01em;
        font-size: 18px;
        line-height: 1.45;
        background: var(--paper);
      }
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(8px + env(safe-area-inset-top, 0px));
        background: var(--lacquer);
      }
      main { max-width: 28em; margin: 20vh auto 0; padding: 0 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
      .wordmark {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1.05;
        margin: 0 0 32px;
      }
      .wordmark-th {
        font-family: "Fahkwang", var(--thai);
        font-size: 26px;
        font-weight: 400;
        line-height: 1;
        color: var(--ink);
      }
      .wordmark-rom {
        font-style: italic;
        font-size: 14px;
        color: var(--ink-2);
      }
      .field { display: flex; flex-direction: column; gap: 8px; }
      label { color: var(--ink-2); font-size: 15px; }
      form { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
      input {
        width: 100%;
        appearance: none;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--ink);
        padding: 0 0 6px;
        font: inherit;
        font-size: 28px;
        outline: none;
      }
      input:focus-visible { outline: 2px solid var(--lacquer); outline-offset: 3px; }
      input:focus { border-bottom-color: var(--lacquer); }
      button {
        height: 36px;
        padding: 0 14px;
        background: var(--lacquer);
        color: var(--paper);
        border: 0;
        border-radius: 2px;
        font: inherit;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
      }
      .miss { margin-top: 16px; color: var(--lacquer); min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">
        <span class="wordmark-th">เรียนเก่ง</span>
        <span class="wordmark-rom">riian gèng</span>
      </p>
      <form id="gate">
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" autocomplete="current-password" autofocus />
        </div>
        <button type="submit">Enter</button>
      </form>
      <p class="miss" id="miss"></p>
    </main>
    <script>
      document.getElementById('gate').addEventListener('submit', async (e) => {
        e.preventDefault()
        const password = new FormData(e.target).get('password')
        const miss = document.getElementById('miss')
        miss.textContent = ''
        const res = await fetch('/api/gate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        })
        if (res.ok) {
          location.href = '/'
          return
        }
        miss.textContent = res.status === 503 ? 'Password is not set.' : 'Wrong password.'
      })
    </script>
  </body>
</html>
